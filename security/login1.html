<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" rel="stylesheet">
<link rel="stylesheet" href="login1.css">
<title>ログインシステム１</title>

</head>


<!--ページ本体-->
<body>
<form name="login_form" onsubmit="return false;">
  <div class="login_form_top">
    <h1><a href="../../index.html" class="btn-real-dent" aria-label="ホーム"><i class="fa fa-home" aria-hidden="true"></i></a> LOGIN</h1>
    <p>UserID、Passwordをご入力の上、「LOGIN」ボタンをクリックしてください。</p>
    <button type="button" class="source-view-btn" id="btn-show-source">📄 ソースコードを見る</button>
  </div>
  <div class="login_form_btm">
    <input id="search-id" type="text" name="user_id" placeholder="UserID" autocomplete="off">
    <input id="search-password" type="password" name="password" placeholder="Password">

    <div class="show-password-container">
      <input type="checkbox" id="show-password-check">
      <label for="show-password-check">パスワードを表示する</label>
    </div>

    <div class="button">
      <input type="submit" name="button" value="LOGIN">
    </div>
    <p id="search-result"></p>
  </div>
</form>

<!-- ソースコード表示モーダル -->
<div id="source-modal" role="dialog" aria-modal="true" aria-labelledby="source-modal-title">
  <div class="source-modal-box">
    <div class="source-modal-header">
      <span class="source-modal-title" id="source-modal-title">📄 PAGE SOURCE CODE</span>
      <div class="source-modal-actions">
        <button type="button" class="modal-btn" id="btn-copy-source">📋 コピー</button>
        <button type="button" class="modal-btn" id="btn-close-source">✕ 閉じる</button>
      </div>
    </div>
    <pre class="source-code-body"><code id="source-code-content"></code></pre>
  </div>
</div>


<!--ページシステム-->
<script>

const pageSourceText = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

// ソースコード表示モーダル制御
const sourceModal = document.getElementById('source-modal');
const sourceCodeContent = document.getElementById('source-code-content');
const btnShowSource = document.getElementById('btn-show-source');
const btnCloseSource = document.getElementById('btn-close-source');
const btnCopySource = document.getElementById('btn-copy-source');

btnShowSource.addEventListener('click', () => {
  sourceCodeContent.textContent = pageSourceText;
  sourceModal.classList.add('open');
});

btnCloseSource.addEventListener('click', () => {
  sourceModal.classList.remove('open');
});

sourceModal.addEventListener('click', (e) => {
  if (e.target === sourceModal) {
    sourceModal.classList.remove('open');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sourceModal.classList.contains('open')) {
    sourceModal.classList.remove('open');
  }
});

btnCopySource.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(pageSourceText);
    btnCopySource.textContent = '✓ コピー完了';
    setTimeout(() => {
      btnCopySource.textContent = '📋 コピー';
    }, 1800);
  } catch (err) {
    const range = document.createRange();
    range.selectNodeContents(sourceCodeContent);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
});

// ユーザーデータの配列（IDとパスワードリスト）
const userDataList = [
  { id: 'sakuranomiya', password: '6934', name: '桜宮さん' },
  { id: 'imamiya', password: '2711', name: '今宮さん' },
  { id: 'baika', password: '2171', name: '梅香さん' },
  { id: 'gest', password: '1234', name: 'ゲストさん' }
];

/** 検索IDを入力するinput要素 */
const searchIdInput = document.querySelector('#search-id');

// ログインユーザー名を表示する要素
const searchResult = document.querySelector('#search-result');

const button = document.querySelector('.button input[type="submit"]');

// 表示切り替えの処理
const passwordInput = document.querySelector('#search-password');
const showPasswordCheck = document.querySelector('#show-password-check');

showPasswordCheck.addEventListener('change', () => {
  if (showPasswordCheck.checked) {
    // チェックが入ったらタイプを text にして見えるようにする
    passwordInput.type = 'text';
  } else {
    // チェックが外れたらタイプを password にして伏せ字に戻す
    passwordInput.type = 'password';
  }
});

// ボタン押下で作動
button.addEventListener('click', () => {
  const searchId = document.querySelector('#search-id').value;
  const searchPassword = document.querySelector('#search-password').value;
  findUser(searchId, searchPassword);
});

/*** 登録しているユーザーを検索する */
function findUser(searchId, searchPassword) {
  // 該当データを取得する
  const targetData = userDataList.find(
    (data) => data.id === searchId && data.password === searchPassword
  );
  
  // 該当データが存在しなかったら、「該当者なし」と表示して終了
  if (targetData == null) {
    searchResult.textContent = 'IDまたはパスワードが違います';
    return;
  }
  
  // 該当データの名前を表示する
  searchResult.textContent = targetData.name + 'がログインしました。';

  // 遷移先ページのアドレス
  window.open('login2.html', '');
}
</script>
</body>
</html>
