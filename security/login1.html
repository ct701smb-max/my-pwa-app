<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" rel="stylesheet">
<title>ログインシステム１</title>
<!--ページデザイン-->
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: #808080;
  font-family: sans-serif;
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
/* ===== ホームボタン ===== */
.btn-real-dent {
  /*周りの凹み*/
  display: inline-block;
  position: relative;
  text-decoration: none;
  color: rgba(3, 69, 244, 0.54);
  width: 30px;
  height: 30px;
  top: 3px;
  border-radius: 50%;
  text-align: center;
  background: #f7f7f7;
  box-shadow: inset 0 0 0px rgba(0, 0, 0, 0.08);
}
.btn-real-dent i {
  /*ボタン自体*/
  position: absolute;
  content: '';
  width: 30px;
  height: 30px;
  line-height: 30px;
  left: 0px;
  top: 3px;
  border-radius: 50%;
  font-size: 15px;
  background-image: linear-gradient(#e8e8e8 0%, #d6d6d6 100%);
  text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.66);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), 0 2px 2px rgba(0, 0, 0, 0.19);
  border-bottom: solid 2px #b5b5b5;
}
  
.btn-real-dent .fa:active {
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 2px 2px rgba(0, 0, 0, 0.19);
  border-bottom: solid 2px #d8d8d8;
}

/* 入力フォームのデザイン */
form {
  width: 100%;
  max-width: 600px;
  padding: 40px 20px;
  background-color: #000;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
}

form h1, form p {
  color: #fff;
  font-weight: 500;
}

form p {
  font-size: 15px;
  color: #fff;
}

/* ソースコード表示ボタン */
.source-view-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 10px auto 4px auto;
  padding: 8px 20px;
  background-color: #111;
  color: #ff69b4;
  border: 2px solid #ff69b4;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s;
}

.source-view-btn:hover {
  background-color: #ff69b4;
  color: #000;
  box-shadow: 0 0 12px rgba(255, 105, 180, 0.65);
}

.source-view-btn:active {
  transform: scale(0.96);
}

/* type="text" と type="password" の入力欄 */
form input[type="text"], form input[type="password"] {
  border: 0;
  background: none;
  display: block;
  margin: 20px auto;
  border: 2px solid #ff69b4;
  padding: 15px 10px;
  width: 200px;
  max-width: 85%;
  outline: none;
  border-radius: 24px;
  transition: 0.25s;
  text-align: center;
  font-size: 20px;
  color: #fff;
}

form input[type="text"]:focus, form input[type="password"]:focus {
  width: 280px;
  max-width: 92%;
  background-color: #353535;
}

/* 表示チェックボックスのデザイン */
.show-password-container {
  color: #fff;
  font-size: 14px;
  margin-bottom: 20px;
}
.show-password-container input[type="checkbox"] {
  margin-right: 5px;
  cursor: pointer;
  vertical-align: middle;
}
.show-password-container label {
  cursor: pointer;
  vertical-align: middle;
}

/* LOGINボタンのデザイン */
form input[type="submit"] {
  border: 0;
  background: none;
  display: block;
  margin: 20px auto;
  border: 2px solid #f0f8ff;
  padding: 15px 10px;
  width: 200px;
  max-width: 85%;
  outline: none;
  color: #fff;
  border-radius: 25px;
  transition: 0.25s;
  text-align: center;
  cursor: pointer;
  font-size: 20px;
}

form input[type="submit"]:hover {
  background-color: #ff69b4;
  border: 2px solid #ff69b4;
}

/* ソースコード表示用モーダル */
#source-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  background-color: rgba(0, 0, 0, 0.88);
  z-index: 10000;
  justify-content: center;
  align-items: center;
  padding: 14px;
}

#source-modal.open {
  display: flex;
}

.source-modal-box {
  width: 100%;
  max-width: 820px;
  height: 82vh;
  height: 82dvh;
  max-height: 680px;
  background-color: #0a0a0a;
  border: 2px solid #ff69b4;
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(255, 105, 180, 0.35);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.source-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background-color: #111;
  border-bottom: 1px solid #2a2a2a;
  gap: 10px;
}

.source-modal-title {
  color: #ff69b4;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  text-align: left;
}

.source-modal-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.modal-btn {
  background-color: #1a1a1a;
  color: #fff;
  border: 2px solid #ff69b4;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.modal-btn:hover {
  background-color: #ff69b4;
  color: #000;
  box-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
}

.modal-btn:active {
  transform: scale(0.95);
}

.source-code-body {
  flex: 1;
  margin: 0;
  padding: 14px 16px;
  overflow: auto;
  background-color: #050505;
  color: #e6e6e6;
  font-family: Consolas, Monaco, "Courier New", monospace;
  font-size: 12.5px;
  line-height: 1.55;
  text-align: left;
  white-space: pre;
  user-select: text;
  -webkit-user-select: text;
}

.source-code-body::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.source-code-body::-webkit-scrollbar-track {
  background: #111;
}

.source-code-body::-webkit-scrollbar-thumb {
  background: #ff69b4;
  border-radius: 4px;
}
</style>
</head>


<!--ページ本体-->
<body>
<form name="login_form" onsubmit="return false;">
  <div class="login_form_top">
    <h1><a href="../index.html" class="btn-real-dent" aria-label="ホーム"><i class="fa fa-home" aria-hidden="true"></i></a> LOGIN</h1>
    <p>UserID、Passwordをご入力の上、「LOGIN」ボタンをクリックしてください。</p>
    <button type="button" class="source-view-btn" id="btn-show-source">📄 ソースコードを見る</button>
  </div>
  <div class="login_form_btm">
    <input id="search-id" type="text" name="user_id" placeholder="UserID" autocomplete="off">
    <input id="search-password" type="password" name="password" placeholder="Password">

    <div class="show-password-container">
      <input type="checkbox" id="show-password-check">
      <label for="show-password-check">パスワードを表示する</label>
    </div>

    <div class="button">
      <input type="submit" name="button" value="LOGIN">
    </div>
    <p id="search-result"></p>
  </div>
</form>

<!-- ソースコード表示モーダル -->
<div id="source-modal" role="dialog" aria-modal="true" aria-labelledby="source-modal-title">
  <div class="source-modal-box">
    <div class="source-modal-header">
      <span class="source-modal-title" id="source-modal-title">📄 PAGE SOURCE CODE</span>
      <div class="source-modal-actions">
        <button type="button" class="modal-btn" id="btn-copy-source">📋 コピー</button>
        <button type="button" class="modal-btn" id="btn-close-source">✕ 閉じる</button>
      </div>
    </div>
    <pre class="source-code-body"><code id="source-code-content"></code></pre>
  </div>
</div>


<!--ページシステム-->
<script>

const pageSourceText = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

// ソースコード表示モーダル制御
const sourceModal = document.getElementById('source-modal');
const sourceCodeContent = document.getElementById('source-code-content');
const btnShowSource = document.getElementById('btn-show-source');
const btnCloseSource = document.getElementById('btn-close-source');
const btnCopySource = document.getElementById('btn-copy-source');

btnShowSource.addEventListener('click', () => {
  sourceCodeContent.textContent = pageSourceText;
  sourceModal.classList.add('open');
});

btnCloseSource.addEventListener('click', () => {
  sourceModal.classList.remove('open');
});

sourceModal.addEventListener('click', (e) => {
  if (e.target === sourceModal) {
    sourceModal.classList.remove('open');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sourceModal.classList.contains('open')) {
    sourceModal.classList.remove('open');
  }
});

btnCopySource.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(pageSourceText);
    btnCopySource.textContent = '✓ コピー完了';
    setTimeout(() => {
      btnCopySource.textContent = '📋 コピー';
    }, 1800);
  } catch (err) {
    const range = document.createRange();
    range.selectNodeContents(sourceCodeContent);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
});

// ユーザーデータの配列（IDとパスワードリスト）
const userDataList = [
  { id: 'sakuranomiya', password: '6934', name: '桜宮さん' },
  { id: 'imamiya', password: '2711', name: '今宮さん' },
  { id: 'baika', password: '2171', name: '梅香さん' },
  { id: 'gest', password: '1234', name: 'ゲストさん' }
];

/** 検索IDを入力するinput要素 */
const searchIdInput = document.querySelector('#search-id');

// ログインユーザー名を表示する要素
const searchResult = document.querySelector('#search-result');

const button = document.querySelector('.button input[type="submit"]');

// 表示切り替えの処理
const passwordInput = document.querySelector('#search-password');
const showPasswordCheck = document.querySelector('#show-password-check');

showPasswordCheck.addEventListener('change', () => {
  if (showPasswordCheck.checked) {
    // チェックが入ったらタイプを text にして見えるようにする
    passwordInput.type = 'text';
  } else {
    // チェックが外れたらタイプを password にして伏せ字に戻す
    passwordInput.type = 'password';
  }
});

// ボタン押下で作動
button.addEventListener('click', () => {
  const searchId = document.querySelector('#search-id').value;
  const searchPassword = document.querySelector('#search-password').value;
  findUser(searchId, searchPassword);
});

/*** 登録しているユーザーを検索する */
function findUser(searchId, searchPassword) {
  // 該当データを取得する
  const targetData = userDataList.find(
    (data) => data.id === searchId && data.password === searchPassword
  );
  
  // 該当データが存在しなかったら、「該当者なし」と表示して終了
  if (targetData == null) {
    searchResult.textContent = 'IDまたはパスワードが違います';
    return;
  }
  
  // 該当データの名前を表示する
  searchResult.textContent = targetData.name + 'がログインしました。';

  // 遷移先ページのアドレス
  window.open('login2.html', '');
}
</script>
</body>
</html>
