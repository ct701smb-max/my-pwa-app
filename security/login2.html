<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="login2.css">
  <title>ログインシステム2</title>
</head>


<!--ページ本体-->
<body>

  <div class="card-container">
    
    <!-- PHASE 1: パスワード入力 -->
    <div id="password-stage">
      <form name="form1" id="login-form" onsubmit="return false;">
        <h1>LOGIN 2</h1>
        <p>Passwordをご入力の上、「Enter」ボタンをクリックしてください。</p>
        <button type="button" class="source-view-btn" id="btn-show-source">📄 ソースコードを見る</button>
        <input type="password" name="pass2" id="password-input" placeholder="Password" autocomplete="off">
        <input type="submit" value="Enter">
      </form>
    </div>

    <!-- PHASE 2: パズル認証 -->
    <div id="ubongo-stage">
      <h1>パズル認証</h1>
      <p style="margin-bottom: 10px;">12種類のピースから正しいピースを選び、白い20マスをすべて埋めてください。</p>

      <div class="stage-flex">
        <!-- 上／左側：パズル枠 -->
        <div class="board-section">
          <p style="color:#00ff00; font-weight:bold;">パズル枠</p>
          <div class="board-outer" id="board-outer">
            <div class="board-grid" id="board-grid">

            </div>
          </div>
          <div class="instructions">💡 黒いマスには置けません<br>💡 選択後に枠タップ or ドラッグで配置</div>
        </div>

        <!-- 下／右側：パーツトレイ ＆ 操作ボタン -->
        <div class="tray-section">
          <div class="tray-top-bar">
            <p id="tray-header" style="color:#fff; margin:0;">パーツトレイ (12 ピース)</p>
            <div class="control-buttons" id="control-buttons">
              <button type="button" class="ctrl-btn" id="btn-rotate" disabled>🔄 回転</button>
              <button type="button" class="ctrl-btn" id="btn-flip" disabled>⇄ 反転</button>
            </div>
          </div>
          
          <div class="tray" id="tray">
            <div id="clear-result">
              <h2>🎉 ログイン成功！ 🎉</h2>
              <a id="winner-list-link" class="winner-link-btn" href="#" target="_blank">突破者リスト</a>
              <a id="form-direct-link" class="form-fallback-link" href="#" target="_blank">自動で開かない場合はこちら（回答フォーム）</a>
            </div>
          </div>
          <div id="tray-instructions" class="instructions">💡 タップで選択（枠が発光） → 再タップ or「回転」で回転 ／「反転」で左右反転</div>
        </div>
      </div>

    </div>

    <div id="status-message"></div>

  </div>

  <!-- ソースコード表示モーダル -->
  <div id="source-modal" role="dialog" aria-modal="true" aria-labelledby="source-modal-title">
    <div class="source-modal-box">
      <div class="source-modal-header">
        <span class="source-modal-title" id="source-modal-title">📄 PAGE SOURCE CODE</span>
        <div class="source-modal-actions">
          <button type="button" class="ctrl-btn" id="btn-copy-source">📋 コピー</button>
          <button type="button" class="ctrl-btn" id="btn-close-source">✕ 閉じる</button>
        </div>
      </div>
      <pre class="source-code-body"><code id="source-code-content"></code></pre>
    </div>
  </div>

  <div id="clear-overlay">
    <div id="clear-banner">🎉 CLEAR!! 🎉</div>
    <div id="clear-subtext">認証成功！ ページへ移動します...</div>
  </div>

  <script src="puzzle.js"></script>

  <!--ページシステム-->
  <script>
    const pageSourceText = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

    document.addEventListener('contextmenu', (e) => {
      if (!e.target.closest('.source-code-body')) {
        e.preventDefault();
      }
    });

    const sourceModal = document.getElementById('source-modal');
    const sourceCodeContent = document.getElementById('source-code-content');
    const btnShowSource = document.getElementById('btn-show-source');
    const btnCloseSource = document.getElementById('btn-close-source');
    const btnCopySource = document.getElementById('btn-copy-source');

    btnShowSource.addEventListener('click', () => {
      sourceCodeContent.textContent = pageSourceText;
      sourceModal.classList.add('open');
    });

    btnCloseSource.addEventListener('click', () => {
      sourceModal.classList.remove('open');
    });

    sourceModal.addEventListener('click', (e) => {
      if (e.target === sourceModal) {
        sourceModal.classList.remove('open');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sourceModal.classList.contains('open')) {
        sourceModal.classList.remove('open');
      }
    });

    btnCopySource.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(pageSourceText);
        btnCopySource.textContent = '✓ コピー完了';
        setTimeout(() => {
          btnCopySource.textContent = '📋 コピー';
        }, 1800);
      } catch (err) {
        const range = document.createRange();
        range.selectNodeContents(sourceCodeContent);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    });

    let failCount = 0;

    // ログインパスワード
    // fromCharCode()メソッドでデコード（復号）してみよう
    const correctPassword = String.fromCharCode(49,50,51,52);

    const passStage = document.getElementById('password-stage');
    const ubongoStage = document.getElementById('ubongo-stage');
    const msg = document.getElementById('status-message');
    const passInput = document.getElementById('password-input');

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      if (passInput.value === correctPassword) {
        failCount = 0;
        msg.innerHTML = "";
        msg.style.display = 'none';
        passStage.style.display = 'none';
        ubongoStage.style.display = 'block';
        initPuzzle();
      } else {
        failCount++;
        msg.style.color = "#ff4500";

        if (failCount >= 3) {
          msg.innerHTML = "パスワードが違います。<br>fromCharCode()メソッドでデコード（復号）してみよう<br><a href='https://its-office.jp/samplecode/strtocodejs.html' target='_blank'>https://its-office.jp/samplecode/strtocodejs.html</a>";
        } else {
          msg.innerHTML = "パスワードが違います。";
        }

        passInput.focus();
        passInput.select();
      }
    });
  </script>
</body>
</html>
