<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログインシステム２</title>

  <style>
    body {
      background-color: #808080;
      margin: 0;
      font-family: sans-serif;
    }

    form {
      width: 90%;
      max-width: 400px;
      padding: 30px 15px;
      margin: 0 auto;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #000;
      text-align: center;
      border-radius: 10px;
    }

    form h1, form p {
      color: #fff;
      font-weight: 500;
    }

    form p {
      font-size: 14px;
    }

    form input[type="password"],
    form input[type="submit"] {
      border: 0;
      background: none;
      display: block;
      margin: 20px auto;
      padding: 12px 10px;
      width: 80%;
      max-width: 280px;
      outline: none;
      font-size: 18px;
      text-align: center;
      border-radius: 24px;
      transition: 0.25s;
      color: #fff;
    }

    form input[type="password"] {
      border: 2px solid #006400;
    }

    form input[type="password"]:focus {
      background-color: #353535;
    }

    form input[type="submit"] {
      border: 2px solid #f0f8ff;
      cursor: pointer;
    }

    form input[type="submit"]:hover {
      background-color: #006400;
      border: 2px solid #006400;
    }

    /* モバイル向け微調整（任意） */
    @media (max-width: 480px) {
      form h1 {
        font-size: 24px;
      }

      form p {
        font-size: 13px;
      }

      form input[type="password"],
      form input[type="submit"] {
        font-size: 16px;
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <form name="form1" id="login-form">
    <h1>LOGIN</h1>
    <p>Passwordをご入力の上、「Enter」ボタンをクリックしてください。</p>
    <input type="password" name="pass2" id="password-input" placeholder="Password">
    <input type="submit" id="submit-button" value="Enter">
  </form>

  <script>
    const correctPassword = String.fromCharCode(115,97,107,117,112,105);
    const redirectUrl = String.fromCharCode(
      119,105,107,105,46,104,116,109,108
    );

    document.getElementById('login-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const inputPassword = document.getElementById('password-input').value;

      if (inputPassword === correctPassword) {
        window.open(redirectUrl, '_blank');
      } else {
        alert("パスワードが違います。　fromCharCode()メソッドでデコード（復号）してみよう");
        document.getElementById('password-input').focus();
        document.getElementById('password-input').select();
      }
    });
  </script>
</body>
</html>
