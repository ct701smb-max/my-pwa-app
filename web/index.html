    <script>
    window.onload = function( ){
        var map = L.map("h_map");
        
        //国土地理院レイヤー
        var tileLayer_gsi = L.tileLayer(
        "http://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
        {attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>国土地理院</a>"}
        );
        tileLayer_gsi.addTo(map);
        
        //表示する地点
        var points = [
           [34.687337892506655, 135.52576861539666],　//大阪城
           [34.70206616122484, 135.53642562412736],　//桜宮中学校
           [34.64870697378868, 135.49820095040198],　//いまみや小中一貫校
           
            
        ];
        
        //　　　　緯度　経度　表示倍率
        map.setView(points[0], 13);
        
        //　マーカーの追加　　緯度　経度
        var marker = L.marker(points[0]);
        marker.bindPopup("大阪城<br><img src='https://osaka-bunkazainavi.org/wp-content/uploads/2022/08/gaikan_002.jpg' width='100' height='100'>");
        marker.addTo(map);
        var marker = L.marker(points[1]);
        marker.bindPopup("桜宮中学校<br><img src='https://upload.wikimedia.org/wikipedia/commons/d/d3/%E5%A4%A7%E9%98%AA%E5%B8%82%E7%AB%8B%E6%A1%9C%E5%AE%AE%E4%B8%AD%E5%AD%A6%E6%A0%A1.jpg' width='100' height='100'>");
        marker.addTo(map);
		var marker = L.marker(points[2]);
        marker.bindPopup("いまみや小中一貫校<br><img src='https://s.resemom.jp/imgs/sp/thumb/85130.jpg' width='100' height='100'>");
        marker.addTo(map);
        
        

        //　表示する地点を線で結ぶ
        var polyline = L.polyline(points, {color: "blue"});
        polyline.addTo(map);
    }
    </script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("menu-toggle");
    const menu = document.getElementById("menu");
    const menuLists = document.querySelectorAll("#menu ul");

    // メニュー開閉
    toggle.addEventListener("click", function (e) {
      e.stopPropagation(); // イベントのバブリングを防止
      toggle.classList.toggle("active");
      menuLists.forEach(function (ul) {
        ul.classList.toggle("active");
      });
    });

    // メニューの外をクリックしたら閉じる
    document.addEventListener("click", function (event) {
      if (!toggle.contains(event.target) && !menu.contains(event.target)) {
        toggle.classList.remove("active");
        menuLists.forEach(function (ul) {
          ul.classList.remove("active");
        });
      }
    });
  });
</script>
<!-- メニュー部分 終了 -->
