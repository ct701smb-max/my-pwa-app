        }

        board.innerHTML += `<line x1="110" y1="250" x2="690" y2="250" stroke="#cbd5e1" stroke-width="6" stroke-dasharray="8 4"/>`;

        this.svg.appendChild(board);
      }

      updatePropertyToolbar() {
        if (this.selectedComponentIds.size === 0) {
          this.propToolbar.classList.add('hidden');
          return;
        }

        const canvasRect = this.canvasContainer.getBoundingClientRect();

        if (this.selectedComponentIds.size > 1) {
          this.propToolbar.innerHTML = `<span style="font-size:0.85rem; font-weight:bold; color:#2563eb;">${this.selectedComponentIds.size} 個のパーツを選択中</span>`;
          
          const btnDel = document.createElement('button');
          btnDel.className = 'prop-btn';
          btnDel.style.backgroundColor = '#fee2e2';
          btnDel.style.color = '#dc2626';
          btnDel.style.borderColor = '#fca5a5';
          btnDel.textContent = '🗑️ 一括削除';
          btnDel.onclick = () => this.deleteSelected();
          this.propToolbar.appendChild(btnDel);

          let sumX = 0, sumY = 0;
          this.selectedComponentIds.forEach(id => {
            const c = this.components.find(comp => comp.id === id);
            if (c) {
              const p = this.getCompPos(c);
              sumX += p.x; sumY += p.y;
            }
          });
          const avgX = sumX / this.selectedComponentIds.size;
          const avgY = sumY / this.selectedComponentIds.size;

          this.propToolbar.style.left = `${avgX}px`;
          this.propToolbar.style.top = `${avgY - 35}px`;
          this.propToolbar.classList.remove('hidden');
          return;
        }

        const compId = Array.from(this.selectedComponentIds)[0];
        const comp = this.components.find(c => c.id === compId);
        if (!comp) {
          this.propToolbar.classList.add('hidden');
          return;
        }

        this.propToolbar.innerHTML = '';

        if (comp.type === 'battery') {
          const btnMinus = document.createElement('button');
          btnMinus.className = 'prop-btn';
          btnMinus.textContent = '-1.5V';
          btnMinus.onclick = () => {
            if (comp.voltage > 1.5) {
              comp.voltage -= 1.5;
              this.saveState();
              this.evaluateCircuit();
              this.render();
            }
          };

          const valLabel = document.createElement('span');
          valLabel.className = 'prop-value';
          valLabel.textContent = `${comp.voltage.toFixed(1)}V`;

          const btnPlus = document.createElement('button');
          btnPlus.className = 'prop-btn';
          btnPlus.textContent = '+1.5V';
          btnPlus.onclick = () => {
            comp.voltage += 1.5;
            this.saveState();
            this.evaluateCircuit();
            this.render();
          };

          this.propToolbar.appendChild(btnMinus);
          this.propToolbar.appendChild(valLabel);
          this.propToolbar.appendChild(btnPlus);
        }

        if (comp.type === 'resistor') {
          const btnMinus = document.createElement('button');
          btnMinus.className = 'prop-btn';
          btnMinus.textContent = '-100Ω';
          btnMinus.onclick = () => {
            if (comp.resistance > 100) {
              comp.resistance -= 100;
            } else {
              comp.resistance = 10;
            }
            this.saveState();
            this.evaluateCircuit();
            this.render();
          };

          const valLabel = document.createElement('span');
          valLabel.className = 'prop-value';
          valLabel.style.cursor = 'pointer';
          valLabel.title = 'クリックして数値入力 (例: 1000, 1k, 1.5M)';
          valLabel.textContent = formatResistance(comp.resistance);

          valLabel.onclick = () => {
            const input = prompt('抵抗値を入力してください (例: 100, 1k, 1.5M):', formatResistance(comp.resistance));
            if (input !== null) {
              let parsed = parseFloat(input);
              if (input.toLowerCase().includes('k')) parsed *= 1000;
              if (input.toLowerCase().includes('m')) parsed *= 1000000;
              
              if (!isNaN(parsed) && parsed > 0) {
                comp.resistance = Math.round(parsed);
                this.saveState();
                this.evaluateCircuit();
                this.render();
              }
            }
          };

          const btnPlus = document.createElement('button');
          btnPlus.className = 'prop-btn';
          btnPlus.textContent = '+100Ω';
          btnPlus.onclick = () => {
            comp.resistance += 100;
            this.saveState();
            this.evaluateCircuit();
            this.render();
          };

          const btnPlusK = document.createElement('button');
          btnPlusK.className = 'prop-btn';
          btnPlusK.textContent = '+1kΩ';
          btnPlusK.onclick = () => {
            comp.resistance += 1000;
            this.saveState();
            this.evaluateCircuit();
            this.render();
          };

          this.propToolbar.appendChild(btnMinus);
          this.propToolbar.appendChild(valLabel);
          this.propToolbar.appendChild(btnPlus);
          this.propToolbar.appendChild(btnPlusK);
        }

        const btnRotate = document.createElement('button');
        btnRotate.className = 'prop-btn';
        btnRotate.textContent = '🔄 90°回転';
        btnRotate.onclick = () => this.rotateSelectedComponent();
        this.propToolbar.appendChild(btnRotate);

        if (['battery', 'led', 'motor'].includes(comp.type)) {
          const btnFlip = document.createElement('button');
          btnFlip.className = 'prop-btn';
          btnFlip.textContent = '↔️ 極性反転';
          btnFlip.onclick = () => this.flipSelectedComponent();
          this.propToolbar.appendChild(btnFlip);
        }

        const btnDel = document.createElement('button');
        btnDel.className = 'prop-btn';
        btnDel.style.backgroundColor = '#fee2e2';
        btnDel.style.color = '#dc2626';
        btnDel.style.borderColor = '#fca5a5';
        btnDel.textContent = '🗑️ 削除';
        btnDel.onclick = () => this.deleteSelected();
        this.propToolbar.appendChild(btnDel);

        const pos = this.getCompPos(comp);
        this.propToolbar.style.left = `${pos.x}px`;
        this.propToolbar.style.top = `${pos.y - 35}px`;
        this.propToolbar.classList.remove('hidden');
      }

      openPdfModal() {
        document.getElementById('pdf-modal').classList.remove('hidden');
      }

      // 外側の導線部分も入るように全体境界を計算してトリミング
      async captureCanvasImageForMode(targetMode) {
        const originalMode = this.mode;
        const tempSelComps = new Set(this.selectedComponentIds);
        const tempSelWire = this.selectedWireId;

        this.selectedComponentIds.clear();
        this.selectedWireId = null;
        this.mode = targetMode;
        this.render();

        const svgClone = this.svg.cloneNode(true);
        svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

        const wires = svgClone.querySelectorAll('.wire, .wire-temp');
        wires.forEach(w => {
          w.setAttribute('fill', 'none');
          if (w.classList.contains('selected-wire')) {
            w.setAttribute('stroke', '#ef4444');
            w.setAttribute('stroke-width', '6');
          } else {
            w.setAttribute('stroke', '#2563eb');
            w.setAttribute('stroke-width', '4');
          }
          w.setAttribute('stroke-linecap', 'round');
          w.setAttribute('stroke-linejoin', 'round');
        });

        const svgString = new XMLSerializer().serializeToString(svgClone);
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);

        const img = new Image();
        img.src = blobURL;

        await new Promise((resolve) => {
          img.onload = resolve;
        });

        const fullWidth = this.svg.clientWidth || 800;
        const fullHeight = this.svg.clientHeight || 500;

        let minX = fullWidth, minY = fullHeight, maxX = 0, maxY = 0;

        if (this.components.length > 0 || this.wires.length > 0) {
          // コンポーネントの位置
          this.components.forEach(c => {
            const p = this.getCompPos(c);
            minX = Math.min(minX, p.x - 60);
            maxX = Math.max(maxX, p.x + 60);
            minY = Math.min(minY, p.y - 40);
            maxY = Math.max(maxY, p.y + 40);
          });

          // 外側の配線（全端点）の座標も計算に含める
          this.wires.forEach(w => {
            const p1 = this.getTerminalPos(w.fromCompId, w.fromTermId);
            const p2 = this.getTerminalPos(w.toCompId, w.toTermId);
            if (p1) {
              minX = Math.min(minX, p1.x); maxX = Math.max(maxX, p1.x);
              minY = Math.min(minY, p1.y); maxY = Math.max(maxY, p1.y);
            }
            if (p2) {
              minX = Math.min(minX, p2.x); maxX = Math.max(maxX, p2.x);
              minY = Math.min(minY, p2.y); maxY = Math.max(maxY, p2.y);
            }
          });

          // 外側の導線部分も十分収まるようにPaddingを多めに追加
          const padding = 40;
          minX -= padding;
          maxX += padding;
          minY -= padding;
          maxY += padding;
        } else {
          minX = 0; minY = 0; maxX = fullWidth; maxY = fullHeight;
        }

        if (targetMode === 'breadboard') {
          minX = Math.min(minX, 20);
          minY = Math.min(minY, 20);
          maxX = Math.max(maxX, 780);
          maxY = Math.max(maxY, 480);
        }

        minX = Math.max(0, Math.floor(minX));
        minY = Math.max(0, Math.floor(minY));
        maxX = Math.min(fullWidth, Math.ceil(maxX));
        maxY = Math.min(fullHeight, Math.ceil(maxY));

        const cropWidth = Math.max(maxX - minX, 100);
        const cropHeight = Math.max(maxY - minY, 100);

        const canvas = document.createElement('canvas');
        const scale = 2;
        canvas.width = cropWidth * scale;
        canvas.height = cropHeight * scale;
        
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cropWidth, cropHeight);

        if (targetMode !== 'breadboard') {
          ctx.fillStyle = '#e5e7eb';
          for (let x = 10 - (minX % 20); x < cropWidth; x += 20) {
            for (let y = 10 - (minY % 20); y < cropHeight; y += 20) {
              ctx.beginPath();
              ctx.arc(x, y, 1.5, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        ctx.drawImage(img, minX, minY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
        URL.revokeObjectURL(blobURL);

        this.mode = originalMode;
        this.selectedComponentIds = tempSelComps;
        this.selectedWireId = tempSelWire;
        this.render();

        return canvas.toDataURL('image/png');
      }

      async generatePDFDirectDownload() {
        const submitBtn = document.getElementById('btn-modal-download');
        submitBtn.disabled = true;
        submitBtn.textContent = 'PDF生成中...';

        try {
          const grade = document.getElementById('pdf-grade').value || '-';
          const className = document.getElementById('pdf-class-name').value || '-';
          const studentNo = document.getElementById('pdf-student-no').value || '-';
          const studentName = document.getElementById('pdf-student-name').value || '未入力';
          const memo = document.getElementById('pdf-memo').value || '';

          const chkPhysical = document.getElementById('chk-physical').checked;
          const chkBreadboard = document.getElementById('chk-breadboard').checked;
          const chkSchematic = document.getElementById('chk-schematic').checked;

          if (!chkPhysical && !chkBreadboard && !chkSchematic) {
            alert('出力する図を少なくとも1つ選択してください。');
            submitBtn.disabled = false;
            submitBtn.textContent = 'PDFダウンロード保存';
            return;
          }

          const partsDetailsMap = {};
          this.components.forEach(c => {
            const names = { battery: '乾電池', resistor: '抵抗器', switch: 'スイッチ', led: 'LED', motor: 'モーター' };
            const name = names[c.type] || c.type;
            
            let spec = '-';
            if (c.type === 'battery') spec = `${c.voltage.toFixed(1)}V`;
            else if (c.type === 'resistor') spec = formatResistance(c.resistance);
            else if (c.type === 'led') spec = '1.5V点灯';
            else if (c.type === 'motor') spec = '1.5V-3.0V';

            const key = `${name} (${spec})`;
            if (!partsDetailsMap[key]) {
              partsDetailsMap[key] = { name, spec, count: 0 };
            }
            partsDetailsMap[key].count++;
          });

          let partsRows = '';
          for (const item of Object.values(partsDetailsMap)) {
            partsRows += `<tr><td>${item.name}</td><td>${item.spec}</td><td>${item.count} 個</td></tr>`;
          }
          if (!partsRows) partsRows = '<tr><td colspan="3">使用パーツなし</td></tr>';

          const images = {};
          if (chkPhysical) images.physical = await this.captureCanvasImageForMode('physical');
          if (chkBreadboard) images.breadboard = await this.captureCanvasImageForMode('breadboard');
          if (chkSchematic) images.schematic = await this.captureCanvasImageForMode('schematic');

          const container = document.getElementById('pdf-render-container');
          
          let diagramsHtml = '';
          if (chkPhysical && chkSchematic) {
            diagramsHtml = `
              <div class="pdf-row-container">
                <div class="pdf-img-block">
                  <div class="pdf-img-title">■ 実体配線図</div>
                  <img src="${images.physical}" class="pdf-img-element-tall" />
                </div>
                <div class="pdf-img-block">
                  <div class="pdf-img-title">■ 回路図</div>
                  <img src="${images.schematic}" class="pdf-img-element-tall" />
                </div>
              </div>
            `;
          } else if (chkPhysical) {
            diagramsHtml = `
              <div class="pdf-row-container">
                <div class="pdf-img-block">
                  <div class="pdf-img-title">■ 実体配線図</div>
                  <img src="${images.physical}" class="pdf-img-element-tall" />
                </div>
              </div>
            `;
          } else if (chkSchematic) {
            diagramsHtml = `
              <div class="pdf-row-container">
                <div class="pdf-img-block">
                  <div class="pdf-img-title">■ 回路図</div>
                  <img src="${images.schematic}" class="pdf-img-element-tall" />
                </div>
              </div>
            `;
          }

          container.innerHTML = `
            <div id="pdf-page-1" style="min-height: 960px; padding-bottom: 20px;">
              <div class="pdf-page-title">電子回路実験レポート</div>
              <table class="pdf-info-table">
                <tr>
                  <td><strong>学年:</strong> ${grade}</td>
                  <td><strong>クラス:</strong> ${className}</td>
                  <td><strong>出席番号:</strong> ${studentNo}</td>
                  <td><strong>氏名:</strong> ${studentName}</td>
                </tr>
              </table>

              <div style="width: 90%; margin: 0 auto 4px auto; font-size: 12px; font-weight: bold;">■ 使用パーツ一覧</div>
              <table class="pdf-parts-table">
                <thead><tr><th>パーツ名</th><th>規格・仕様</th><th>数量</th></tr></thead>
                <tbody>${partsRows}</tbody>
              </table>

              ${diagramsHtml}

              ${memo ? `
                <div style="width: 90%; margin: 0 auto 4px auto; font-size: 12px; font-weight: bold;">■ 考察・メモ</div>
                <div style="width: 90%; margin: 0 auto; font-size: 11px; border: 1px solid #cbd5e1; padding: 6px; border-radius: 4px; white-space: pre-wrap; word-break: break-all;">${memo}</div>
              ` : ''}
            </div>

            ${chkBreadboard ? `
              <div id="pdf-page-2" style="min-height: 960px; padding-top: 10px;">
                <div class="pdf-page-title">電子回路実験レポート (ブレッドボード図)</div>
                <div class="pdf-row-container">
                  <div class="pdf-img-block" style="margin-top: 15px;">
                    <div class="pdf-img-title">■ ブレッドボード図</div>
                    <img src="${images.breadboard}" class="pdf-img-element-bb" />
                  </div>
                </div>
              </div>
            ` : ''}
          `;

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();

          const page1El = document.getElementById('pdf-page-1');
          const canvas1 = await html2canvas(page1El, { scale: 2, useCORS: true });
          const imgData1 = canvas1.toDataURL('image/png');
          const pdfHeight1 = (canvas1.height * pdfWidth) / canvas1.width;
          pdf.addImage(imgData1, 'PNG', 0, 0, pdfWidth, pdfHeight1);

          const page2El = document.getElementById('pdf-page-2');
          if (page2El) {
            pdf.addPage();
            const canvas2 = await html2canvas(page2El, { scale: 2, useCORS: true });
            const imgData2 = canvas2.toDataURL('image/png');
            const pdfHeight2 = (canvas2.height * pdfWidth) / canvas2.width;
            pdf.addImage(imgData2, 'PNG', 0, 0, pdfWidth, pdfHeight2);
          }

          pdf.save('circuit_report.pdf');

          document.getElementById('pdf-modal').classList.add('hidden');
        } catch (err) {
          console.error('PDF生成処理エラー:', err);
          alert('PDFの出力中にエラーが発生しました。');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'PDFダウンロード保存';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      window.app = new CircuitApp();
    });
  </script>
