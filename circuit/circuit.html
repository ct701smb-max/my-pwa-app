      getBreadboardHoleNodeId(x, y) {
        if (y === 80) return 'bb_power_top_pos';
        if (y === 100) return 'bb_power_top_neg';
        if (y === 360) return 'bb_power_bottom_pos';
        if (y === 380) return 'bb_power_bottom_neg';

        const startX = 140;
        const col = Math.round((x - startX) / 20) + 1;
        if (col >= 1 && col <= 27) {
          if (y >= 130 && y <= 210) {
            return `bb_col_${col}_top`;
          } else if (y >= 250 && y <= 330) {
            return `bb_col_${col}_bottom`;
          }
        }
        return `bb_point_${x}_${y}`;
      }

      handleHoleClick(x, y) {
        const snapped = { x, y };

        if (this.connectingStart) {
          this.wires.push({
            id: 'wire_' + Date.now(),
            mode: 'breadboard',
            fromCompId: this.connectingStart.compId,
            fromTermId: this.connectingStart.termId,
            toPos: snapped
          });
          this.connectingStart = null;
          this.tempWirePos = null;
          this.saveState();
          this.evaluateCircuit();
        } else if (!this.selectedHole) {
          this.selectedHole = snapped;
        } else {
          if (this.selectedHole.x !== snapped.x || this.selectedHole.y !== snapped.y) {
            const bridgeWire = {
              id: 'bridge_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
              type: 'bridge',
              mode: 'breadboard',
              fromPos: { x: this.selectedHole.x, y: this.selectedHole.y },
              toPos: { x: snapped.x, y: snapped.y },
              color: '#ef4444'
            };
            this.wires.push(bridgeWire);
            this.saveState();
            this.evaluateCircuit();
          }
          this.selectedHole = null;
        }
        this.render();
      }

      snapToGrid(x, y) {
        if (this.mode === 'breadboard' || this.mode === 'schematic') {
          return {
            x: Math.round(x / this.gridSize) * this.gridSize,
            y: Math.round(y / this.gridSize) * this.gridSize
          };
        }
        return { x, y };
      }

      getCompPos(comp) {
        if (!comp.positions) {
          comp.positions = {
            physical: { x: comp.x || 150, y: comp.y || 150 },
            breadboard: { x: comp.x || 150, y: comp.y || 150 },
            schematic: { x: comp.x || 150, y: comp.y || 150 }
          };
        }
        if (!comp.positions[this.mode]) {
          comp.positions[this.mode] = { x: 150, y: 150 };
        }
        return comp.positions[this.mode];
      }

      getTerminalAbsolutePos(comp, terminal) {
        const pos = this.getCompPos(comp);
        return {
          x: pos.x + terminal.relX,
          y: pos.y + terminal.relY
        };
      }

      addComponent(type, rawX, rawY) {
        const { x, y } = this.snapToGrid(rawX, rawY);
        const id = 'comp_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        
        const voltage = (type === 'battery') ? 1.5 : undefined;
        const resistance = (type === 'resistor') ? 100 : undefined;
        const light = (type === 'cds') ? 50 : undefined;
        const flipped = false;

        const rotation = { physical: 0, schematic: 0, breadboard: 0 };
        const positions = { physical: { x, y }, breadboard: { x, y }, schematic: { x, y } };
        const terminals = this.generateTerminals(id, type, flipped, rotation[this.mode]);

        const newComp = { id, type, positions, state: false, voltage, resistance, light, flipped, rotation, terminals };
        this.components.push(newComp);
        
        this.selectedComponentIds.clear();
        this.selectedComponentIds.add(id);
        this.selectedWireId = null;

        this.saveState();
        this.render();
      }

      getCompRotation(comp) {
        if (typeof comp.rotation === 'object' && comp.rotation !== null) {
          return comp.rotation[this.mode] || 0;
        }
        return comp.rotation || 0;
      }

      generateTerminals(id, type, flipped, rotation = 0) {
        const dir = flipped ? -1 : 1;
        let baseTerminals = [];

        if (type === 'battery') {
          baseTerminals = [
            { id: `${id}_t1`, name: '+', baseRelX: 45 * dir, baseRelY: 0, polarity: 'pos' },
            { id: `${id}_t2`, name: '-', baseRelX: -45 * dir, baseRelY: 0, polarity: 'neg' }
          ];
        } else if (type === 'led') {
          baseTerminals = [
            { id: `${id}_t1`, name: '+ (アノード)', baseRelX: -35 * dir, baseRelY: 0, polarity: 'pos' },
            { id: `${id}_t2`, name: '- (カソード)', baseRelX: 35 * dir, baseRelY: 0, polarity: 'neg' }
          ];
        } else if (type === 'rgb-led') {
          baseTerminals = [
            { id: `${id}_t1`, name: '-', baseRelX: -45 * dir, baseRelY: 40, polarity: 'neg' },
            { id: `${id}_t2`, name: '+赤', baseRelX: -15 * dir, baseRelY: 40, polarity: 'pos' },
            { id: `${id}_t3`, name: '+緑', baseRelX: 15 * dir, baseRelY: 40, polarity: 'pos' },
            { id: `${id}_t4`, name: '+青', baseRelX: 45 * dir, baseRelY: 40, polarity: 'pos' }
          ];
        } else if (type === 'motor') {
          baseTerminals = [
            { id: `${id}_t1`, name: '+', baseRelX: -35 * dir, baseRelY: 0, polarity: 'pos' },
            { id: `${id}_t2`, name: '-', baseRelX: 35 * dir, baseRelY: 0, polarity: 'neg' }
          ];
        } else if (type === 'cds') {
          baseTerminals = [
            { id: `${id}_t1`, name: '1', baseRelX: -35, baseRelY: 0, polarity: 'none' },
            { id: `${id}_t2`, name: '2', baseRelX: 35, baseRelY: 0, polarity: 'none' }
          ];
        } else {
          baseTerminals = [
            { id: `${id}_t1`, name: '1', baseRelX: -35, baseRelY: 0, polarity: 'none' },
            { id: `${id}_t2`, name: '2', baseRelX: 35, baseRelY: 0, polarity: 'none' }
          ];
        }

        const rad = (rotation * Math.PI) / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        return baseTerminals.map(t => ({
          id: t.id,
          name: t.name,
          relX: Math.round(t.baseRelX * cos - t.baseRelY * sin),
          relY: Math.round(t.baseRelX * sin + t.baseRelY * cos),
          polarity: t.polarity
        }));
      }

      rotateSelectedComponent() {
  if (this.selectedComponentIds.size !== 1) return;
  const compId = Array.from(this.selectedComponentIds)[0];
  const comp = this.components.find(c => c.id === compId);
  if (!comp) return;

  // rotation がオブジェクトでない場合の初期化
  if (typeof comp.rotation !== 'object' || comp.rotation === null) {
    const oldRot = comp.rotation || 0;
    comp.rotation = { physical: oldRot, schematic: oldRot, breadboard: oldRot };
  }

  // 現在表示中のモードの角度のみを回転（+90度）
  const curRot = comp.rotation[this.mode] || 0;
  comp.rotation[this.mode] = (curRot + 90) % 360;

  // 現在のモードの回転角度を使って端子座標を更新
  comp.terminals = this.generateTerminals(comp.id, comp.type, comp.flipped, comp.rotation[this.mode]);

  this.saveState();
  this.evaluateCircuit();
  this.render();
}


      flipSelectedComponent() {
        if (this.selectedComponentIds.size !== 1) return;
        const compId = Array.from(this.selectedComponentIds)[0];
        const comp = this.components.find(c => c.id === compId);
        if (!comp) return;

        comp.flipped = !comp.flipped;

        if (['battery', 'led', 'motor', 'resistor', 'cds'].includes(comp.type)) {
          this.wires.forEach(w => {
            if (w.fromCompId === comp.id) {
              if (w.fromTermId === `${comp.id}_t1`) w.fromTermId = `${comp.id}_t2`;
              else if (w.fromTermId === `${comp.id}_t2`) w.fromTermId = `${comp.id}_t1`;
            }
            if (w.toCompId === comp.id) {
              if (w.toTermId === `${comp.id}_t1`) w.toTermId = `${comp.id}_t2`;
              else if (w.toTermId === `${comp.id}_t2`) w.toTermId = `${comp.id}_t1`;
            }
          });
        }

        comp.terminals = this.generateTerminals(comp.id, comp.type, comp.flipped, this.getCompRotation(comp));
        this.saveState();
        this.evaluateCircuit();
        this.render();
      }

      deleteSelected() {
  let hasDeleted = false;

  if (this.selectedComponentIds.size > 0) {
    this.selectedComponentIds.forEach(id => {
      this.components = this.components.filter(c => c.id !== id);
      this.wires = this.wires.filter(w => w.fromCompId !== id && w.toCompId !== id);
    });
    this.selectedComponentIds.clear();
    hasDeleted = true;
  }
  
  if (this.selectedWireIds.size > 0) {
    this.wires = this.wires.filter(w => !this.selectedWireIds.has(w.id));
    this.selectedWireIds.clear();
    hasDeleted = true;
  }

  if (hasDeleted) {
    this.saveState();
    this.evaluateCircuit();
    this.render();
  }
}

      exportDataToFile() {
        const state = JSON.stringify({ components: this.components, wires: this.wires, viewState: this.viewState }, null, 2);
        const blob = new Blob([state], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `circuit_data_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      importDataFromFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data.components && data.wires) {
              this.components = data.components;
              this.wires = data.wires;
              if (data.viewState) this.viewState = data.viewState;
              this.components.forEach(c => {
                if (c.rotation === undefined) c.rotation = { physical: 0, schematic: 0, breadboard: 0 };
                if (c.type === 'resistor' && !c.resistance) c.resistance = 100;
                if (c.type === 'cds' && c.light === undefined) c.light = 50;
                c.terminals = this.generateTerminals(c.id, c.type, c.flipped, this.getCompRotation(c));
              });
              this.selectedComponentIds.clear();
              this.selectedWireId = null;
              this.saveState();
              this.evaluateCircuit();
              this.render();
              alert('回路データを正常に読み込みました。');
            } else {
              alert('無効な回路データファイルです。');
            }
          } catch (err) {
            alert('ファイルの読み込みに失敗しました。');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      }

      saveState() {
        if (this.historyIndex < this.history.length - 1) {
          this.history = this.history.slice(0, this.historyIndex + 1);
        }
        const state = JSON.stringify({ components: this.components, wires: this.wires, viewState: this.viewState });
        this.history.push(state);
        this.historyIndex++;
        localStorage.setItem('circuit_sim_data_v9', state);
      }

      loadState() {
        const saved = localStorage.getItem('circuit_sim_data_v9');
        if (saved) {
          try {
            const data = JSON.parse(saved);
            this.components = data.components || [];
            this.wires = data.wires || [];
            if (data.viewState) this.viewState = data.viewState;
            
            this.components.forEach(c => {
              if (c.rotation === undefined) c.rotation = { physical: 0, schematic: 0, breadboard: 0 };
              if (c.type === 'resistor' && !c.resistance) c.resistance = 100;
              if (c.type === 'cds' && c.light === undefined) c.light = 50;
              c.terminals = this.generateTerminals(c.id, c.type, c.flipped, this.getCompRotation(c));
            });

            this.history = [saved];
            this.historyIndex = 0;
          } catch (e) {
            console.error("データ読み込みエラー", e);
          }
        }
      }

      undo() {
        if (this.historyIndex > 0) {
          this.historyIndex--;
          const data = JSON.parse(this.history[this.historyIndex]);
          this.components = data.components;
          this.wires = data.wires;
          if (data.viewState) this.viewState = data.viewState;
          this.selectedComponentIds.clear();
          this.selectedWireId = null;
          this.evaluateCircuit();
          this.render();
        }
      }

      redo() {
        if (this.historyIndex < this.history.length - 1) {
          this.historyIndex++;
          const data = JSON.parse(this.history[this.historyIndex]);
          this.components = data.components;
          this.wires = data.wires;
          if (data.viewState) this.viewState = data.viewState;
          this.selectedComponentIds.clear();
          this.selectedWireId = null;
          this.evaluateCircuit();
          this.render();
        }
      }

      clearAll() {
        if (confirm('すべての回路要素を消去してリセットしますか？')) {
          this.components = [];
          this.wires = [];
          this.selectedComponentIds.clear();
          this.selectedWireId = null;
          this.powerOn = false;
          this.btnPower.textContent = '🔌 電源 OFF';
          this.btnPower.className = 'btn btn-power-off';
          this.saveState();
          this.evaluateCircuit();
          this.render();
        }
      }

      evaluateCircuit() {
        const uniqueComponents = Array.from(
          new Map(this.components.map(c => [c.id, c])).values()
        );

        const activeMap = new Map();
        const currentMap = new Map();

        uniqueComponents.forEach(c => {
          activeMap.set(c.id, false);
          currentMap.set(c.id, 0);
        });

        if (!this.powerOn) {
          this.setStatus('info', 'ℹ️', '電源はOFFです。');
          return { status: 'OFF', activeMap, currentMap, totalResistance: 0, totalCurrent: 0 };
        }

        const batteries = uniqueComponents.filter(c => c.type === 'battery');
        if (batteries.length === 0) {
          this.setStatus('error', '⚠️', '電源（乾電池）が配置されていません。');
          return { status: 'NO_BATTERY', activeMap, currentMap, totalResistance: 0, totalCurrent: 0 };
        }

        const totalVoltage = batteries.reduce((sum, b) => sum + (Number(b.voltage) || 1.5), 0);

        const termNodeMap = new Map();
        const allTerms = [];
        this.components.forEach(c => c.terminals.forEach(t => allTerms.push(t)));

        let nodeIdCounter = 0;
        allTerms.forEach(t => termNodeMap.set(t.id, null));

        const validWires = this.wires.filter(w => {
          if (this.mode === 'breadboard') {
            return w.mode === 'breadboard';
          } else {
            return w.mode !== 'breadboard' && w.type !== 'bridge';
          }
        });

        const unionNodes = (idA, idB) => {
          const n1 = termNodeMap.get(idA);
          const n2 = termNodeMap.get(idB);
          if (n1 === null && n2 === null) {
            const newN = 'node_' + (++nodeIdCounter);
            termNodeMap.set(idA, newN);
            termNodeMap.set(idB, newN);
          } else if (n1 !== null && n2 === null) {
            termNodeMap.set(idB, n1);
          } else if (n1 === null && n2 !== null) {
            termNodeMap.set(idA, n2);
          } else if (n1 !== n2) {
            allTerms.forEach(t => {
              if (termNodeMap.get(t.id) === n2) termNodeMap.set(t.id, n1);
            });
          }
        };

        validWires.forEach(w => {
          if (w.fromTermId && w.toTermId) {
            unionNodes(w.fromTermId, w.toTermId);
          }
        });

        if (this.mode === 'breadboard') {
          const holeToTerms = new Map();

          allTerms.forEach(t => {
            const p = this.getTerminalPosByTermId(t.id);
            if (!p) return;
            const holeNode = this.getBreadboardHoleNodeId(p.x, p.y);
            if (!holeToTerms.has(holeNode)) {
              holeToTerms.set(holeNode, []);
            }
            holeToTerms.get(holeNode).push(t.id);
          });

          validWires.forEach(w => {
            if (w.fromTermId && w.toPos) {
              const hNode = this.getBreadboardHoleNodeId(w.toPos.x, w.toPos.y);
              if (!holeToTerms.has(hNode)) holeToTerms.set(hNode, []);
              holeToTerms.get(hNode).push(w.fromTermId);
            } else if (w.type === 'bridge' && w.fromPos && w.toPos) {
              const hNode1 = this.getBreadboardHoleNodeId(w.fromPos.x, w.fromPos.y);
              const hNode2 = this.getBreadboardHoleNodeId(w.toPos.x, w.toPos.y);
              
              const list1 = holeToTerms.get(hNode1) || [];
              const list2 = holeToTerms.get(hNode2) || [];
              const merged = [...list1, ...list2];
              holeToTerms.set(hNode1, merged);
              holeToTerms.set(hNode2, merged);
            }
          });

          holeToTerms.forEach((terms) => {
            for (let i = 0; i < terms.length; i++) {
              for (let j = i + 1; j < terms.length; j++) {
                unionNodes(terms[i], terms[j]);
              }
            }
          });
        } else {
          allTerms.forEach(t1 => {
            const p1 = this.getTerminalPosByTermId(t1.id);
            if (!p1) return;
            allTerms.forEach(t2 => {
              if (t1.id === t2.id) return;
              const p2 = this.getTerminalPosByTermId(t2.id);
              if (!p2) return;
              if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < 10) {
                unionNodes(t1.id, t2.id);
              }
            });
          });
        }

        allTerms.forEach(t => {
          if (termNodeMap.get(t.id) === null) {
            termNodeMap.set(t.id, 'node_' + (++nodeIdCounter));
          }
        });

        const rawPaths = [];
        batteries.forEach(bat => {
          const posTerm = bat.terminals.find(t => t.polarity === 'pos');
          const negTerm = bat.terminals.find(t => t.polarity === 'neg');
          if (!posTerm || !negTerm) return;

          const startNode = termNodeMap.get(posTerm.id);
          const targetNode = termNodeMap.get(negTerm.id);

          const traceFromNode = (currentNode, currentPath, visitedComps) => {
            if (currentNode === targetNode && currentPath.length > 0) {
              rawPaths.push([...currentPath]);
              return;
            }

            const connectedTerms = allTerms.filter(t => termNodeMap.get(t.id) === currentNode);
            connectedTerms.forEach(inTerm => {
              const comp = uniqueComponents.find(c => c.terminals.some(t => t.id === inTerm.id));
              if (!comp || comp.type === 'battery' || visitedComps.has(comp.id)) return;

              let canPass = true;
              let outTerm = null;

              if (comp.type === 'switch' && !comp.state) {
                canPass = false;
              } else if (comp.type === 'led' || comp.type === 'rgb-led') {
                if (inTerm.polarity === 'pos') {
                  outTerm = comp.terminals.find(t => t.polarity === 'neg');
                } else {
                  canPass = false;
                }
              } else {
                outTerm = comp.terminals.find(t => t.id !== inTerm.id);
              }

              if (canPass && outTerm) {
                const nextNode = termNodeMap.get(outTerm.id);
                const nextVisited = new Set(visitedComps).add(comp.id);
                traceFromNode(nextNode, [...currentPath, { comp, inTerm }], nextVisited);
              }
            });
          };

          traceFromNode(startNode, [], new Set());
        });

        if (rawPaths.length === 0) {
          const switches = uniqueComponents.filter(c => c.type === 'switch');
          if (switches.some(s => !s.state)) {
            this.setStatus('warning', '🔘', 'スイッチがオフになっているか、回路が未完成です。');
          } else {
            this.setStatus('error', '⚡', '回路がつながっていないか、LEDの極性が逆です。');
          }
          return { status: 'OPEN', activeMap, currentMap, totalResistance: 0, totalCurrent: 0 };
        }

        const validPaths = [];
        const seenPathKeys = new Set();
        rawPaths.forEach(path => {
          const key = path.map(item => String(item.comp.id)).sort().join(',');
          if (!seenPathKeys.has(key)) {
            seenPathKeys.add(key);
            validPaths.push(path);
          }
        });

        const branchMap = new Map();
        validPaths.forEach(path => {
          const resistors = path.map(item => item.comp).filter(c => c.type === 'resistor' || c.type === 'cds');
          if (resistors.length > 0) {
            const key = resistors.map(r => String(r.id)).sort().join('-');
            if (!branchMap.has(key)) {
              branchMap.set(key, resistors);
            }
          }
        });

        const branchList = Array.from(branchMap.values());
        let totalResistance = 0;

        if (branchList.length > 0) {
          const commonResistorIds = branchList[0]
            .map(r => String(r.id))
            .filter(id => branchList.every(b => b.some(r => String(r.id) === id)));

          let R_common = 0;
          branchList[0].forEach(r => {
            if (commonResistorIds.includes(String(r.id))) {
              const v = r.type === 'cds' ? this.getCdsResistance(r) : parseFloat(r.resistance);
              R_common += (!isNaN(v) && v > 0) ? v : 100;
            }
          });

          let branchConductance = 0;
          branchList.forEach(resistors => {
            let R_branch_unique = 0;
            resistors.forEach(r => {
              if (!commonResistorIds.includes(String(r.id))) {
                const v = r.type === 'cds' ? this.getCdsResistance(r) : parseFloat(r.resistance);
                R_branch_unique += (!isNaN(v) && v > 0) ? v : 100;
              }
            });

            if (R_branch_unique > 0) {
              branchConductance += (1 / R_branch_unique);
            }
          });

          const R_parallel = branchConductance > 0 ? (1 / branchConductance) : 0;
          totalResistance = R_common + R_parallel;
        }

        let isShortCircuit = false;
        validPaths.forEach(path => {
          if (path.every(item => item.comp.type !== 'resistor' && item.comp.type !== 'led' && item.comp.type !== 'motor' && item.comp.type !== 'rgb-led' && item.comp.type !== 'cds')) {
            isShortCircuit = true;
          }
        });

        if (isShortCircuit) {
          this.setStatus('error', '💥', 'ショート（短絡）しています！電池が高熱になる危険があります！');
          return { status: 'SHORT', activeMap, currentMap, totalResistance: 0, totalCurrent: 0 };
        }

        this.components.forEach(c => {
          if (c.type === 'rgb-led') {
            c.rgbChannels = { r: false, g: false, b: false };
          }
        });

        const totalCurrent = totalResistance > 0 ? (totalVoltage / totalResistance) : totalVoltage;
        const VF_PER_LED = 1.5;

        validPaths.forEach(path => {
          let ledCountInPath = path.filter(item => item.comp.type === 'led' || item.comp.type === 'rgb-led').length;
          
          path.forEach(item => {
            const comp = item.comp;
            const inTerm = item.inTerm;

            if (comp.type === 'led' || comp.type === 'rgb-led') {
              if (totalVoltage / (ledCountInPath || 1) >= VF_PER_LED) {
                activeMap.set(comp.id, true);
                currentMap.set(comp.id, (currentMap.get(comp.id) || 0) + totalCurrent);

                if (comp.type === 'rgb-led' && inTerm) {
                  const name = (inTerm.name || '').toLowerCase();
                  const id = (inTerm.id || '').toLowerCase();

                  const isRed = name.includes('赤') || name.includes('r') || id.endsWith('t2');
                  const isGreen = name.includes('緑') || name.includes('g') || id.endsWith('t3');
                  const isBlue = name.includes('青') || name.includes('b') || id.endsWith('t4');

                  if (isRed) comp.rgbChannels.r = true;
                  if (isGreen) comp.rgbChannels.g = true;
                  if (isBlue) comp.rgbChannels.b = true;
                }
              }
            } else {
              activeMap.set(comp.id, true);
              currentMap.set(comp.id, (currentMap.get(comp.id) || 0) + totalCurrent);
            }
          });
        });

        const rText = totalResistance >= 1000 
          ? `${(totalResistance / 1000).toFixed(2)} kΩ` 
          : `${totalResistance.toFixed(1)} Ω`;

        const iText = totalCurrent >= 1 
          ? `${totalCurrent.toFixed(2)} A` 
          : `${(totalCurrent * 1000).toFixed(1)} mA`;

        const anyActive = Array.from(activeMap.values()).some(v => v);

        if (anyActive) {
          this.setStatus('success', '✅', `回路動作中 ｜ 電圧: ${totalVoltage.toFixed(1)}V ｜ 抵抗器の合成抵抗: ${rText} ｜ 全電流: ${iText}`);
          return { status: 'OK', activeMap, currentMap, totalResistance, totalCurrent };
        } else {
          this.setStatus('warning', '💡', `電圧不足です (${totalVoltage.toFixed(1)}V) ｜ 抵抗器の合成抵抗: ${rText}`);
          return { status: 'LOW_VOLTAGE', activeMap, currentMap, totalResistance, totalCurrent };
        }
      }

      getTerminalPosByTermId(termId) {
        for (const comp of this.components) {
          const term = comp.terminals.find(t => t.id === termId);
          if (term) {
            return this.getTerminalAbsolutePos(comp, term);
          }
        }
        return null;
      }

      setStatus(type, icon, msg) {
        this.statusBar.className = `status-bar status-${type}`;
        this.statusIcon.textContent = icon;
        this.statusMessage.textContent = msg;
      }

      render() {
        this.viewportGroup.innerHTML = '';
        this.viewportGroup.setAttribute('transform', `translate(${this.panX}, ${this.panY}) scale(${this.scale})`);

        const simResult = this.evaluateCircuit();
        const activeMap = simResult.activeMap || new Map();
        const currentMap = simResult.currentMap || new Map();

        if (this.mode === 'breadboard') {
          this.renderBreadboardBackground();
        }

        this.wires.forEach(wire => {
          if (this.mode === 'breadboard' && wire.mode !== 'breadboard') return;
          if (this.mode !== 'breadboard' && wire.mode === 'breadboard') return;

          let p1, p2;

          if (wire.type === 'bridge') {
            if (this.mode !== 'breadboard') return;
            p1 = wire.fromPos;
            p2 = wire.toPos;
          } else {
            p1 = wire.fromCompId ? this.getTerminalPos(wire.fromCompId, wire.fromTermId) : wire.fromPos;
            p2 = wire.toCompId ? this.getTerminalPos(wire.toCompId, wire.toTermId) : wire.toPos;
          }

          if (p1 && p2) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            let d = '';

            if (this.mode === 'schematic') {
              const offsetX = wire.midOffsetX || 0;
              const offsetY = wire.midOffsetY || 0;

              if (Math.abs(p1.x - p2.x) < 5 || Math.abs(p1.y - p2.y) < 5) {
                d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
              } else {
                const midX = Math.round((p1.x + p2.x) / 2 / 20) * 20 + offsetX;
                d = `M ${p1.x} ${p1.y} L ${midX} ${p1.y} L ${midX} ${p2.y} L ${p2.x} ${p2.y}`;
              }
            } else if (this.mode === 'breadboard') {
              d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
            } else {
              d = `M ${p1.x} ${p1.y} Q ${(p1.x+p2.x)/2} ${(p1.y+p2.y)/2 + 25} ${p2.x} ${p2.y}`;
            }

            line.setAttribute('d', d);
            const isSelected = this.selectedWireIds.has(wire.id);
line.setAttribute('class', isSelected ? 'wire selected-wire' : 'wire');
            if (wire.color) {
              line.setAttribute('stroke', wire.color);
            }

            line.addEventListener('pointerdown', (e) => {
  e.stopPropagation();

  // 配線作成中のキャンセル処理
  if (this.connectingStart) {
    this.connectingStart = null;
    this.tempWirePos = null;
    this.render();
    return;
  }

  // パーツ選択の解除
  this.selectedComponentIds.clear();

  // Shiftキー押下時は追加/解除（トグル）、通常クリック時は単一選択
  if (e.shiftKey) {
    if (this.selectedWireIds.has(wire.id)) {
      this.selectedWireIds.delete(wire.id);
    } else {
      this.selectedWireIds.add(wire.id);
    }
  } else {
    // 既に選択済みの配線をドラッグする場合を考慮し、未選択の場合のみクリアして選択
    if (!this.selectedWireIds.has(wire.id)) {
      this.selectedWireIds.clear();
      this.selectedWireIds.add(wire.id);
    }
  }

  // 回路図（schematic）モード時の配線ドラッグ移動処理
  if (this.mode === 'schematic') {
    let isDragging = false;
    const startX = e.clientX;
    const startY = e.clientY;
    const initialOffsetX = wire.midOffsetX || 0;
    const initialOffsetY = wire.midOffsetY || 0;

    const onPointerMove = (moveEvt) => {
      const dx = (moveEvt.clientX - startX) / this.scale;
      const dy = (moveEvt.clientY - startY) / this.scale;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) isDragging = true;
      if (isDragging) {
        wire.midOffsetX = Math.round((initialOffsetX + dx) / 20) * 20;
        wire.midOffsetY = Math.round((initialOffsetY + dy) / 20) * 20;
        this.render();
      }
    };

    const onPointerUp = () => {
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      if (isDragging) {
        this.saveState();
      }
    };

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
  }

  this.render();
});


            this.viewportGroup.appendChild(line);
          }
        });

        if (this.connectingStart && this.tempWirePos) {
          const p1 = this.getTerminalPos(this.connectingStart.compId, this.connectingStart.termId);
          if (p1) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            let d = '';
            if (this.mode === 'schematic') {
              const midX = (p1.x + this.tempWirePos.x) / 2;
              d = `M ${p1.x} ${p1.y} L ${midX} ${p1.y} L ${midX} ${this.tempWirePos.y} L ${this.tempWirePos.x} ${this.tempWirePos.y}`;
            } else {
              d = `M ${p1.x} ${p1.y} L ${this.tempWirePos.x} ${this.tempWirePos.y}`;
            }
            line.setAttribute('d', d);
            line.setAttribute('class', 'wire-temp');
            this.viewportGroup.appendChild(line);
          }
        }

        if (this.selectionBox) {
          const x = Math.min(this.selectionBox.x1, this.selectionBox.x2);
          const y = Math.min(this.selectionBox.y1, this.selectionBox.y2);
          const width = Math.abs(this.selectionBox.x2 - this.selectionBox.x1);
          const height = Math.abs(this.selectionBox.y2 - this.selectionBox.y1);

          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', x);
          rect.setAttribute('y', y);
          rect.setAttribute('width', width);
          rect.setAttribute('height', height);
          rect.setAttribute('fill', 'rgba(52, 152, 219, 0.2)');
          rect.setAttribute('stroke', '#3498db');
          rect.setAttribute('stroke-dasharray', '4');
          rect.setAttribute('pointer-events', 'none');

          this.viewportGroup.appendChild(rect);
        }

        this.components.forEach(comp => {
  const pos = this.getCompPos(comp);
  const rot = this.getCompRotation(comp);

  // 表示モードに応じた回転角度で端子位置をその都度生成する
  comp.terminals = this.generateTerminals(comp.id, comp.type, comp.flipped, rot);

          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
          g.setAttribute('class', 'component-group');

          if (this.selectedComponentIds.has(comp.id)) {
            const selRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            selRect.setAttribute('x', -55); selRect.setAttribute('y', -30);
            selRect.setAttribute('width', 110); selRect.setAttribute('height', 60);
            selRect.setAttribute('rx', 8);
            selRect.setAttribute('class', 'selection-box');
            selRect.setAttribute('transform', `rotate(${rot})`);
            
            g.appendChild(selRect);
          }

          const isCompWorking = activeMap.get(comp.id) || false;
          const compCurrent = currentMap.get(comp.id) || 0;

          const bodyG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          bodyG.setAttribute('transform', `rotate(${rot})`);
          this.renderComponentBody(bodyG, comp, isCompWorking, compCurrent);
          g.appendChild(bodyG);

          comp.terminals.forEach(term => {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', term.relX);
            circle.setAttribute('cy', term.relY);
            circle.setAttribute('r', 6);
            circle.setAttribute('fill', term.polarity === 'pos' ? '#ef4444' : (term.polarity === 'neg' ? '#2563eb' : '#4b5563'));
            circle.setAttribute('stroke', '#ffffff');
            circle.setAttribute('stroke-width', '2');
            circle.setAttribute('class', 'terminal');

            circle.addEventListener('pointerdown', (e) => {
              e.stopPropagation();

              this.selectedComponentIds.clear();
              this.selectedWireId = null;

                  });

            if (e.target.classList.contains('terminal')) return;
            e.stopPropagation();
            if (this.connectingStart) {
              this.connectingStart = null;
              this.tempWirePos = null;
              this.render();

            if (!this.selectedComponentIds.has(comp.id) && !e.shiftKey) {
              this.selectedComponentIds.clear();
              this.selectedComponentIds.add(comp.id);
            } else if (e.shiftKey) {
              this.selectedComponentIds.add(comp.id);
            }
            this.selectedWireId = null;

            if (comp.type === 'switch') {
              comp.state = !comp.state;
              this.saveState();
              this.evaluateCircuit();
            }
            this.render();

            let isDragging = true;
            const startX = e.clientX;
            const startY = e.clientY;

            const initialPositions = new Map();
            this.selectedComponentIds.forEach(id => {
              const targetComp = this.components.find(c => c.id === id);
              if (targetComp) {
                const p = this.getCompPos(targetComp);
                initialPositions.set(id, { x: p.x, y: p.y });
              }
            });

            const onMove = (moveEvt) => {
              if (!isDragging) return;
              const dx = (moveEvt.clientX - startX) / this.scale;
              const dy = (moveEvt.clientY - startY) / this.scale;

              this.selectedComponentIds.forEach(id => {
                const targetComp = this.components.find(c => c.id === id);
                const initP = initialPositions.get(id);
                if (targetComp && initP) {
                  const rawX = initP.x + dx;
                  const rawY = initP.y + dy;
                  const snapped = this.snapToGrid(rawX, rawY);
                  targetComp.positions[this.mode] = { x: snapped.x, y: snapped.y };
                }
              });
              this.evaluateCircuit();
              this.render();
            };

            const onUp = () => {
              if (isDragging) {
                isDragging = false;
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onUp);
                this.saveState();
              }
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);

      getTerminalPos(compId, termId) {
  const comp = this.components.find(c => c.id === compId);
  if (!comp) return null;

  // 現在のモードの回転角度を取得して端子位置を動的生成
  const rot = this.getCompRotation(comp);
  const updatedTerminals = this.generateTerminals(comp.id, comp.type, comp.flipped, rot);
  const term = updatedTerminals.find(t => t.id === termId);

  if (!term) return null;
  const pos = this.getCompPos(comp);
  return {
    x: pos.x + term.relX,
    y: pos.y + term.relY
  };
}

  // --- 2. 穴の生成（色指定・ノードID割り当て） ---
  const createSquareHole = (x, y, nodeId, customColor, customStroke) => {
    const isSelected = this.selectedHole && this.selectedHole.x === x && this.selectedHole.y === y;
    
    const holeColor = isSelected ? '#ef4444' : (customColor || '#334155');
    const strokeColor = isSelected ? '#b91c1c' : (customStroke || '#94a3b8');

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x - 6);
    rect.setAttribute('y', y - 6);
    rect.setAttribute('width', 12);
    rect.setAttribute('height', 12);
    rect.setAttribute('rx', 2);
    rect.setAttribute('fill', holeColor);
    rect.setAttribute('stroke', strokeColor);
    rect.setAttribute('stroke-width', '1.5');
    rect.setAttribute('class', 'bb-hole');
    
    rect.setAttribute('data-x', x);
    rect.setAttribute('data-y', y);
    if (nodeId) {
      rect.setAttribute('data-node-id', nodeId);
    }

    rect.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      this.handleHoleClick(x, y, nodeId);
    });

    return rect;
  };

  // 電源レール穴の生成
  for (let col = 0; col < 26; col++) {
    const x = startX + col * 20;
    g.appendChild(createSquareHole(x, 80, 'bb_power_vcc_top', '#fca5a5', '#ef4444'));
    g.appendChild(createSquareHole(x, 100, 'bb_power_gnd_top', '#93c5fd', '#3b82f6'));
    g.appendChild(createSquareHole(x, 360, 'bb_power_vcc_bottom', '#fca5a5', '#ef4444'));
    g.appendChild(createSquareHole(x, 380, 'bb_power_gnd_bottom', '#93c5fd', '#3b82f6'));
  }

  // メイン端子穴の生成（1〜26列）
  for (let col = 1; col <= 26; col++) {
    const x = startX + (col - 1) * 20;

    // 上段（A〜E行）
    for (let r = 0; r < 5; r++) {
      const y = 130 + r * 20;
      g.appendChild(createSquareHole(x, y, `bb_col_${col}_top`));
    }

    // 下段（F〜J行）
    for (let r = 0; r < 5; r++) {
      const y = 250 + r * 20;
      g.appendChild(createSquareHole(x, y, `bb_col_${col}_bottom`));
    }
  }

  this.viewportGroup.appendChild(g);
}




      updatePropertyToolbar() {
        if (!this.propToolbar) return;

        if (this.selectedComponentIds.size === 1) {
          const compId = Array.from(this.selectedComponentIds)[0];
          const comp = this.components.find(c => c.id === compId);

          if (!comp) {
            this.propToolbar.classList.add('hidden');
            return;
          }

          const pos = this.getCompPos(comp);
          const screenPos = {
            x: pos.x * this.scale + this.panX,
            y: (pos.y - 35) * this.scale + this.panY
          };

          this.propToolbar.style.left = `${screenPos.x}px`;
          this.propToolbar.style.top = `${screenPos.y}px`;
          this.propToolbar.innerHTML = '';

          const rotBtn = document.createElement('button');
          rotBtn.className = 'prop-btn';
          rotBtn.textContent = '🔄 回転';
          rotBtn.onclick = (e) => { e.stopPropagation(); this.rotateSelectedComponent(); };
          this.propToolbar.appendChild(rotBtn);

          if (['battery', 'led', 'motor', 'rgb-led'].includes(comp.type)) {
            const flipBtn = document.createElement('button');
            flipBtn.className = 'prop-btn';
            flipBtn.textContent = '⇄ 反転';
            flipBtn.onclick = (e) => { e.stopPropagation(); this.flipSelectedComponent(); };
            this.propToolbar.appendChild(flipBtn);
          }

          if (comp.type === 'battery') {
            const minusBtn = document.createElement('button');
            minusBtn.className = 'prop-btn';
            minusBtn.textContent = '-1.5V';
            minusBtn.onclick = (e) => {
              e.stopPropagation();
              comp.voltage = Math.max(1.5, Math.round(((comp.voltage || 1.5) - 1.5) * 10) / 10);
              this.saveState();
              this.evaluateCircuit();
              this.render();
            };

            const vLabel = document.createElement('span');
            vLabel.style.fontSize = '0.85rem';
            vLabel.style.fontWeight = 'bold';
            vLabel.textContent = ` ${Number(comp.voltage || 1.5).toFixed(1)}V `;

            const plusBtn = document.createElement('button');
            plusBtn.className = 'prop-btn';
            plusBtn.textContent = '+1.5V';
            plusBtn.onclick = (e) => {
              e.stopPropagation();
              comp.voltage = Math.min(12.0, Math.round(((comp.voltage || 1.5) + 1.5) * 10) / 10);
              this.saveState();
              this.evaluateCircuit();
              this.render();
            };

            this.propToolbar.appendChild(minusBtn);
            this.propToolbar.appendChild(vLabel);
            this.propToolbar.appendChild(plusBtn);
          } else if (comp.type === 'resistor') {
            const rInput = document.createElement('input');
            rInput.type = 'number';
            rInput.min = '1';
            rInput.max = '1000000';
            rInput.value = comp.resistance || 100;
            rInput.style.width = '70px';
            rInput.style.padding = '2px 4px';
            rInput.style.fontSize = '0.85rem';

            const applyResistorVal = () => {
              let val = parseFloat(rInput.value);
              if (isNaN(val) || val <= 0) val = 100;
              comp.resistance = val;
              this.saveState();
              this.evaluateCircuit();
              this.render();
            };

            rInput.onchange = (e) => { e.stopPropagation(); applyResistorVal(); };
            rInput.onkeydown = (e) => {
              e.stopPropagation();
              if (e.key === 'Enter') applyResistorVal();
            };
            rInput.onclick = (e) => e.stopPropagation();

            const unitLabel = document.createElement('span');
            unitLabel.style.fontSize = '0.85rem';
            unitLabel.style.fontWeight = 'bold';
            unitLabel.textContent = ' Ω';

            this.propToolbar.appendChild(rInput);
            this.propToolbar.appendChild(unitLabel);
          } else if (comp.type === 'cds') {
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.min = '0';
            slider.max = '100';
            slider.value = comp.light !== undefined ? comp.light : 50;
            slider.className = 'prop-slider';

            const lightLabel = document.createElement('span');
            lightLabel.style.fontSize = '0.85rem';
            lightLabel.style.fontWeight = 'bold';
            lightLabel.textContent = ` ☀️${slider.value}% `;

            slider.oninput = (e) => {
              e.stopPropagation();
              comp.light = parseInt(slider.value, 10);
              lightLabel.textContent = ` ☀️${slider.value}% `;
              this.evaluateCircuit();
              this.render();
            };

            slider.onchange = (e) => {
              e.stopPropagation();
              this.saveState();
            };

            this.propToolbar.appendChild(slider);
            this.propToolbar.appendChild(lightLabel);
          }

          this.propToolbar.classList.remove('hidden');
        } else {
          this.propToolbar.classList.add('hidden');
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new CircuitApp();
    });
  </script>
