<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Webエディター</title>
    <link rel="stylesheet" href="edit2.css">
    <link href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="your_script_name.js"></script>
</head>
<body>
    
    <div class="editor-container">
        <nav class="tab-menu">
            <div class="tab-group">
                <input type="text" class="file-name-input" id="htmlFileNameInput" value="index.html">
                <button class="tab-button active" data-tab="html-panel">HTML</button>
            </div>
            
            <div class="tab-group">
                <input type="text" class="file-name-input" id="cssFileNameInput" value="style.css">
                <button class="tab-button" data-tab="css-panel">CSS</button>
            </div>
            
            <div class="tab-group">
                <input type="text" class="file-name-input" id="jsFileNameInput" value="script.js">
                <button class="tab-button" data-tab="js-panel">JavaScript</button>
            </div>
            
            <button class="tab-button" data-tab="preview-panel"><i class="fas fa-eye"></i></button>
        </nav>

        <div class="content-wrapper">
            
            <div id="html-panel" class="tab-content active">
                <div class="code-editor-wrapper">
                    <div class="line-numbers" id="htmlLineNumbers">1</div>
                    <textarea id="htmlCode" class="code-input" placeholder="ここにHTMLコードを入力"></textarea>
                </div>
            </div>

            <div id="css-panel" class="tab-content">
                <div class="code-editor-wrapper">
                    <div class="line-numbers" id="cssLineNumbers">1</div>
                    <textarea id="cssCode" class="code-input" placeholder="ここにCSSコードを入力"></textarea>
                </div>
            </div>

            <div id="js-panel" class="tab-content">
                <div class="code-editor-wrapper">
                    <div class="line-numbers" id="jsLineNumbers">1</div>
                    <textarea id="jsCode" class="code-input" placeholder="ここにJavaScriptコードを入力"></textarea>
                </div>
            </div>

            <div id="preview-panel" class="tab-content">
                <iframe id="preview" title="Live Preview"></iframe>
            </div>
        </div>
        
        <div id="importedImageList" class="imported-images-list">
            </div>

        <div class="file-operations">
            
            <div class="file-name-input-group">
                <label for="fileNameInput">エクスポートファイル名:</label>
                <input type="text" id="fileNameInput" value="project" placeholder="ファイル名を入力 (例: project)">
            </div>
            
            <button id="toggleImageListButton" class="file-button toggle-button">
                画像リストを隠す
            </button>

            <label for="importFile" class="file-button import-button">
                コード/ZIPをインポート
            </label>
            <input type="file" id="importFile" accept=".html,.css,.js,.zip" style="display: none;">
            
            <label for="importImageFile" class="file-button image-import-button">
                画像をインポート
            </label>
            <input type="file" id="importImageFile" accept="image/*" style="display: none;">
            
            <button id="exportZipButton" class="file-button export-button">
                ZIPでエクスポート (すべて)
            </button>
        </div>
    </div>

    <script src="edit2.js"></script> 
</body>
</html>
