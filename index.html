<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./system/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="./system/p1.png">
    <meta name="theme-color" content="#333333">
    <title>Webアプリランチャー</title>
    <!-- Tailwind CSS CDNの読み込み (モダンなデザインとレスポンシブ対応に最適) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6.5.1 CDNの読み込み (アイコン表示のため) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Interフォントの設定とライトグレイの背景 */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Tailwindのslate-50に近い色 */
        }
        
        /* * アプリケーションアイコンのスタイル
         * Tailwindのtransitionクラスとbox-shadowを組み合わせ、カスタムhover効果を追加
         */
        .app-item-icon {
            /* transition-all duration-300 ease-in-outを適用 */
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .app-item-icon:hover {
            /* 浮き上がる効果を強調 */
            transform: translateY(-6px);
            /* より深く、鮮やかな影を作成 */
            box-shadow: 0 15px 25px -3px rgba(0, 0, 0, 0.15), 0 6px 15px -3px rgba(0, 0, 0, 0.08);
        }
        
        /* * 画像を円形にクリッピングするためのカスタムクラス (Tailwindのrounded-fullと類似) 
         * clip-pathはより複雑な形状に対応できます
         */
        .clip-circle {
            clip-path: circle(50% at 50% 50%);
        }
        
        /* * SVGアイコンのデフォルトカラー設定
         * group-hover:fill-indigo-600 クラスと組み合わせて使用
         */
        .pdf-icon-default-color {
            fill: #DC2626; /* Red-600 */
        }
        .web-editor-icon-default-color {
            fill: #10B981; /* Emerald-500 */
        }
    </style>
</head>
<body class="min-h-screen antialiased flex flex-col items-center p-4 sm:p-8">

    <!-- ヘッダーエリア -->
    <header class="w-full max-w-4xl mb-12 text-center">
        <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-800 tracking-tight mb-2">
            Webアプリ <span class="text-indigo-600">ランチャー</span>
        </h1>
        <p class="text-lg text-gray-500">
            よく使うサービスに素早くアクセス
        </p>
    </header>

    <!-- アプリコンテナ (グリッドレイアウトでレスポンシブに配置) -->
    <main class="w-full max-w-5xl px-2">
        <!-- 3列(sm)から6列(lg)に可変するレスポンシブグリッド -->
        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-6 sm:gap-8">

            <!-- 各Webアプリのリンクアイテムの定義: app-item, groupクラスが重要 -->

            <!-- 1. Googleカレンダー -->
            <a href="https://calendar.google.com/" target="_blank" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <i class="fas fa-calendar-alt text-4xl sm:text-5xl text-red-500"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">カレンダー</p>
            </a>

            <!-- 2. Gmail -->
            <a href="https://mail.google.com/" target="_blank" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <i class="fas fa-envelope text-4xl sm:text-5xl text-blue-500"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">Gmail</p>
            </a>

            <!-- 3. Googleドライブ -->
            <a href="https://drive.google.com/" target="_blank" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <i class="fas fa-database text-4xl sm:text-5xl text-green-500"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">Googleドライブ</p>
            </a>

            <!-- 4. Googleマップ -->
            <a href="https://maps.google.com/" target="_blank" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <i class="fas fa-map-marker-alt text-4xl sm:text-5xl text-yellow-500"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">Googleマップ</p>
            </a>

            <!--5.Google gemini-->
            <a href="https://gemini.google.com/" target="_blank" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-10 w-10 sm:h-12 sm:w-12">
                        <defs>
                            <linearGradient id="gemini-gradient-1" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#4285F4;" />
                                <stop offset="100%" style="stop-color:#DB4437;" />
                            </linearGradient>
                            <linearGradient id="gemini-gradient-2" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#F4B400;" />
                                <stop offset="100%" style="stop-color:#0F9D58;" />
                            </linearGradient>
                        </defs>
                        <path d="M12 0L0 12L12 24L24 12L12 0ZM12 4.0L20 12L12 20L4 12L12 4.0Z" fill="url(#gemini-gradient-1)"/>
                        <path d="M12 4.0L4 12L12 20L20 12L12 4.0Z" fill="url(#gemini-gradient-2)" opacity="0.8"/>
                    </svg>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">Gemini</p>
            </a>

            <!--6.ウェザーニュース-->
            <a href="https://weathernews.jp/" target="_blank" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <i class="fas fa-cloud-sun text-4xl sm:text-5xl text-blue-500"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">ウェザーニュース</p>
            </a>
                
            <!-- 7. GitHub -->
            <a href="https://github.com/" target="_blank" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <i class="fab fa-github text-4xl sm:text-5xl text-gray-900"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">GitHub</p>
            </a>

                
            <!-- 8. 設定 (汎用アイコン) -->
            <a href="./web/wiki.html" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <i class="fas fa-cogs text-4xl sm:text-5xl text-gray-600"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">Webコード</p>
            </a>

            <!-- 9. 透過画像 (Opacityアニメーションの例) -->
            <a href="./png/png.html" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <!-- プレースホルダー画像を使用し、CSSで半透明にする -->
                    <i class="fas fa-clone text-4xl sm:text-5xl text-red-500"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">透過画像</p>
            </a>

            <!-- 10. トリミング -->
            <a href="./PDF/cropper.html" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                  
                    <i class="fas fa-crop text-4xl sm:text-5xl text-blue-500"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">トリミング</p>
            </a>

            <!-- 11. 画像toPDF -->
            <a href="./PDF/pdf.html" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <i class="fas fa-file-pdf text-4xl sm:text-5xl text-red-500"></i>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">画像toPDF</p>
            </a>

            <!-- 12. CADアイコン (余白を削りサイズを他のアイコンと統一) -->
            <a href="./CAD/cad.html" target="_blank" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3 flex items-center justify-center">
                    <svg
                        class="w-10 h-10 sm:w-12 sm:h-12 transform scale-125"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 80 80">
                        <defs>
                            <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#E6C280"/>
                                <stop offset="100%" stop-color="#C69C5D"/>
                            </linearGradient>
                            <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#A47C43"/>
                                <stop offset="100%" stop-color="#785428"/>
                            </linearGradient>
                        </defs>
                        <!-- translateを中央寄りに調整し、スケールを少し上げて枠内に最適化 -->
                        <g transform="translate(11, 7) scale(1.05)">
                            <!-- 上面 -->
                            <polygon points="32,6 54,18 32,30 14,20" fill="url(#woodGrad)" />
                            <!-- 左面 -->
                            <polygon points="14,20 32,30 26,40 8,30" fill="#F3D19E" />
                            <!-- 右面 -->
                            <polygon points="32,30 54,18 54,48 32,60" fill="url(#shadowGrad)" />
                            <!-- 左下 -->
                            <polygon points="8,30 26,40 26,60 8,50" fill="#966F3B" />
                            <!-- CADマーカー -->
                            <circle cx="32" cy="60" r="5" fill="#00D2FF" opacity="0.9"/>
                            <line x1="27" y1="60" x2="37" y2="60" stroke="#FFFFFF" stroke-width="2"/>
                            <line x1="32" y1="55" x2="32" y2="65" stroke="#FFFFFF" stroke-width="2"/>
                        </g>
                    </svg>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">CAD</p>
            </a>
                
            <!-- 13. Webエディタアイコンの例 (SVGを使用 - コードブラケットに修正) -->
            <a href="./edit/edit.html" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <!-- SVGアイコン: コードブラケット (< >) -->
                    <svg class="w-10 h-10 web-editor-icon-default-color group-hover:fill-indigo-600 transition duration-300" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="currentColor" d="M14.6 16.6l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4zm-5.2 0L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4z"/>
                    </svg>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">Webエディタ</p>
            </a>
                
            <!-- 13-2. Webエディタアイコンの例 (SVGを使用 - コードブラケットに修正) -->
            <a href="./edit2/edit2.html" class="app-item flex flex-col items-center text-gray-700 hover:text-indigo-600 transition duration-300 group">
                <div class="app-item-icon bg-white p-5 sm:p-6 rounded-3xl shadow-xl border border-gray-100 mb-2 sm:mb-3">
                    <!-- SVGアイコン: コードブラケット (< >) -->
                    <svg class="w-10 h-10 web-editor-icon-default-color group-hover:fill-indigo-600 transition duration-300" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="currentColor" d="M14.6 16.6l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4zm-5.2 0L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4z"/>
                    </svg>
                </div>
                <p class="text-sm font-medium text-center truncate w-full px-1">Webエディタ2</p>
            </a>
        </div>
    </main>
    <script src="./system/register.js"></script>
</body>
</html>
