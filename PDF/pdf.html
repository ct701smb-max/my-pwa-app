<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="pdf.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <title>画像 to PDF 変換ツール</title>
    <link href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.4/piexif.min.js"></script>
</head>
<body>

    <div class="container">
        <h1><a href="../index.html" class="btn-real-dent" aria-label="ホーム"><i class="fa fa-home" aria-hidden="true"></i></a> 画像からPDFへの変換</h1>
        <p>プレビューエリアを選択で拡大、移動元と移動先のファイルを選択して並び順を変更可能。<br>画像ファイルとPDFファイルの結合も可能。</p>
                
        <div class="upload-controls" style="display: flex; gap: 10px; width: 100%; max-width: 400px; margin: 10px 0 20px 0;">
            <div style="flex: 1; text-align: left;">
                <label for="imageUpload" class="file-select-btn" style="display: block; background-color: var(--primary-color); color: white; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500;">ファイルを選択</label>
                <input type="file" id="imageUpload" accept="image/*,application/pdf" multiple style="display: none;">
            </div>
            <div style="flex: 1; text-align: left;">
                <label for="folderUpload" class="file-select-btn" style="display: block; background-color: #555555; color: white; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500;">フォルダを選択</label>
                <input type="file" id="folderUpload" accept="image/*,application/pdf" multiple webkitdirectory directory style="display: none;">
            </div>
        </div>

        <div class="sort-controls">
            <button id="sortFilenameAscBtn" title="ファイル名昇順 (A→Z)">ファイル名順 (A↓)</button>
            <button id="sortFilenameDescBtn" title="ファイル名降順 (Z→A)">ファイル名逆順 (Z↑)</button>
        </div>
        
        <div id="progressContainerFile" class="progress-container" style="display: none;">
            <p id="progressTextFile" class="progress-text">準備中...</p>
            <div class="progress-bar-background">
                <div id="progressBarFile" class="progress-bar"></div>
            </div>
        </div>
        
        <!-- ファイル移動モード用の操作コントロール（プレビューエリアが全画面/拡大されたときのみ表示・有効化） -->
        <div id="moveControlsContainer" style="display: none; background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 10px; text-align: center;">
            <p id="moveStatusText" style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; color: #333;">ファイル移動モード: 移動したいファイルを選択してください</p>
            <div style="display: flex; justify-content: center; gap: 15px; align-items: center; flex-wrap: wrap;">
                <button id="cancelMoveBtn" style="padding: 4px 10px; font-size: 0.8rem; background-color: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; display: none;">選択解除</button>
            </div>
        </div>

        <!-- プレビューエリア：clickイベントのバブリングを妨げないよう変更 -->
        <div id="previewArea" class="preview-area">
        </div>

        <div class="orientation-selector">
            <h2>全体PDF向き (全ページに適用)</h2>
            <div style="text-align:center;">
                <input type="radio" id="portrait" name="globalPdfOrientation" value="p" checked>
                <label for="portrait">縦 (A4 縦)</label>
                <input type="radio" id="landscape" name="globalPdfOrientation" value="l">
                <label for="landscape">横 (A4 横)</label>
            </div>
            <p style="font-size: 0.8rem; color: #888; margin-top: 5px;">※ 個別設定で向きを変更した場合、そちらが優先されます。</p>
        </div>
        
        <div class="image-orientation-selector">
            <h2>PDFページ向き (ファイル個別)</h2>
            <div id="imageOrientationControls">
                <p style="font-size: 0.9rem; color: #888; margin: 5px 0;">画像を選択すると、このエリアに個別のページ向き設定が表示されます。</p>
            </div>
        </div>

        <div class="margin-selector">
            <h2>PDFの余白</h2>
            <div>
            <input type="radio" id="fill" name="imageFit" value="fill" checked>
            <label for="fill">余白なし (アスペクト比無視で拡大)</label>
            </div>
            <div>
            <input type="radio" id="fit" name="imageFit" value="fit">
            <label for="fit">余白あり (画像全体を表示)</label>
            </div>
        </div>

        <div class="filename-input">
            <h2>PDFファイル名</h2>
            <input type="text" id="pdfFilename" placeholder="例: documents_combined">
            <small>.pdfが自動で付きます</small>
        </div>
        <div class="sort-controls">
            <button id="reloadBtn" onclick="location.reload()">🔄 アプリを更新</button>
        </div>
        <div id="progressContainerPdf" class="progress-container" style="display: none;">
            <p id="progressTextPdf" class="progress-text">準備中...</p>
            <div class="progress-bar-background">
                <div id="progressBarPdf" class="progress-bar"></div>
            </div>
        </div>
        
        <button id="convertBtn" disabled>PDFに変換してダウンロード</button>
    
    </div>

    <script src="pdf.js"></script>
</body>
</html>
