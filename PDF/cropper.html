<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチ画像トリミングツール</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <link href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" rel="stylesheet">
    <link rel="stylesheet" href="cropper.css">
    <style>
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .file-item:hover {
            background-color: #f5f5f5;
        }

        .file-item span {
            flex-grow: 1; /* ファイル名が領域を占有するように */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
        }

        .file-item button {
            margin-left: 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #fff;
            padding: 3px 6px;
            line-height: 1;
            flex-shrink: 0; /* ボタンのサイズが変わらないように */
        }

        /* 削除ボタン */
        .remove-btn {
            color: #ff4d4f; 
            border-color: #ffccc7;
        }

        /* 個別ダウンロードボタン */
        .download-single-btn {
            color: #1890ff; 
            border-color: #91d5ff;
            font-weight: bold;
        }
        /* 長押し・選択・拡大メニューを無効化 */
#imageDisplay,
#imageDisplay * {
    -webkit-touch-callout: none; /* iOS 長押しメニュー禁止 */
    -webkit-user-select: none;
    user-select: none;
    touch-action: none; /* ジェスチャー抑制 */
}
    </style>
</head>
<body>

    <div id="editorContainer">
        <h1><a href="../index.html" class="btn-real-dent" aria-label="ホーム"><i class="fa fa-home" aria-hidden="true"></i></a> 画像トリミングツール</h1>

        <input type="file" id="imageInput" accept="image/*" multiple>

        <hr>

        <div id="fileControls">
            <h3>ファイル並び替え・削除 (ドラッグ＆ドロップ)</h3>
            <button id="sortByNameButton">ファイル名順でソート ⬆️</button> 
            <button id="duplicateButton" disabled>現在の画像を複製してリストに追加</button>
            </div>

        <ul id="fileList" class="sortable-list">
            </ul>
        
        <hr>

        <div id="presetControls">
    <button id="presetFull">画像の全体</button>
    <button id="cropButton" disabled>✅トリミング完了</button>
    <button id="presetLeftHalf">左半分</button>
    <button id="presetRightHalf">右半分</button>
    <button id="presetCenterSquare">正方形</button>
</div>

        <hr>

        <div id="imageDisplay">
            画像をアップロードしてください。
        </div>

        <div id="navigationControls">
            <button id="prevButton" disabled>← 前の画像</button>
            <div id="imageIndexInfo">
                画像 <span id="currentImageIndex">0</span> / <span id="totalImages">0</span>
            </div>
            <button id="nextButton" disabled>次の画像 →</button>
        </div>
        
        <hr>
<button id="saveCurrentImageButton" disabled>現在の画像を個別に保存</button>
        <button id="saveAllButton" disabled>全ファイルを一括ダウンロード</button>
        <hr>
        <button id="reloadBtn" onclick="location.reload()">🔄 アプリを更新</button>
        <a href="pdf.html"><button>PDFへの変換</button></a>
    </div>
<div id="cropAlert" class="alert-popup">トリミングが完了しました！</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="cropper.js"></script>
</body>
</html>
